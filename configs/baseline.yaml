experiment_name: "deepfake_baseline_xception"
description: "Baseline configuration using Xception backbone, 3-layer dense head, and facial coordinate integration."
seed : 42
data:
  resolution: [299, 299]
  batch_size: 32
  num_workers: 4
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip_prob: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1

model:
  backbone: "xception"
  pretrained: true
  freeze_backbone: false
  classifier_head:
    type: "3_layer_dense"
    layers:
      - type: "Dense"
        units: 512
        activation: "relu"
        dropout: 0.5
      - type: "Dense"
        units: 256
        activation: "relu"
        dropout: 0.3
      - type: "Dense"
        units: 2
        activation: "softmax"
  facial_coordinates:
    enabled: true
    fusion_method: "concatenate" # Nối vector tọa độ vào trước lớp Dense thứ 1

optimization:
  optimizer: "AdamW"
  learning_rate: 0.0001
  weight_decay: 0.01
  loss_function: "CrossEntropyLoss"
  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 2
  early_stopping:
    patience: 5
    monitor: "val_loss"
  max_epochs: 20

cross_validation:
  strategy: "StratifiedKFold"
  n_splits: 5
  shuffle: true

metrics:
  - "accuracy"
  - "f1_score"
  - "roc_auc"